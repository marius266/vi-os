<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VI OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: control-room rundown — slim header bar with timecode, then a two-column grid of panels (emails + approvals left, to-do + calendar + pipeline right), one column on phones */
:root{
  --bg:#eef0f2; --panel:#ffffff; --ink:#15191e; --muted:#5d6670; --line:#d6dbe0;
  --accent:#0a6cff; --tally:#e0242f; --warn:#c77700; --ok:#1f8a4c;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--panel:#171b21;--ink:#e7eaee;--muted:#9aa4af;--line:#2a3039;--accent:#4d93ff;--tally:#ff4a52;--warn:#f0a330;--ok:#3cc172;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1216;--panel:#171b21;--ink:#e7eaee;--muted:#9aa4af;--line:#2a3039;--accent:#4d93ff;--tally:#ff4a52;--warn:#f0a330;--ok:#3cc172;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px}
h1{font:700 2.4rem/1 var(--display);letter-spacing:.02em;margin:0;text-wrap:balance}
h1 small{font:600 1rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:10px}
.tc{font:600 1rem var(--mono);display:flex;align-items:center;gap:8px;color:var(--muted)}
.tally{width:10px;height:10px;border-radius:50%;background:var(--tally);box-shadow:0 0 0 3px color-mix(in srgb,var(--tally) 25%,transparent)}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;min-width:0}
h2{font:600 1.25rem/1.1 var(--display);letter-spacing:.08em;text-transform:uppercase;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 span{font:400 .8rem var(--mono);letter-spacing:0;text-transform:none;color:var(--muted)}
ol,ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
li:first-child{border-top:0;padding-top:0}
.n{font:600 .85rem var(--mono);color:var(--muted);padding-top:2px}
.t{font-weight:600}
.d{grid-column:2;color:var(--muted);font-size:.92rem}
.d a{color:var(--accent)}
.pill{display:inline-block;font:600 .7rem/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 6px;border-radius:3px;border:1px solid currentColor;margin-right:6px;vertical-align:1px}
.p-urgent{color:var(--tally)}.p-today{color:var(--warn)}.p-fyi{color:var(--muted)}.p-auto{color:var(--ok)}
.time{font:600 .9rem var(--mono);white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 3ch;align-items:center;gap:10px;font-size:.88rem}
.bar .lab{position:relative;padding:3px 8px;border-radius:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar .fill{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 18%,transparent);z-index:0}
.bar .lab b{position:relative;font-weight:400}
.bar .v{font:600 .85rem var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.foot{font-size:.82rem;color:var(--muted)}
li.done .t,li.done .d{text-decoration:line-through;color:var(--muted);font-weight:400}
li.done .n{color:var(--ok)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>VI OS <small>Morning update</small></h1>
    <div class="tc"><span class="tally" aria-hidden="true"></span><span id="stamp">loading…</span></div>
  </header>
  <div class="grid">
    <div class="col">
      <section><h2>Top 5 emails to answer <span id="emailNote"></span></h2><ol id="emails"></ol></section>
      <section><h2>Waiting on you <span>approvals &amp; checks</span></h2><ul id="approvals"></ul></section>
    </div>
    <div class="col">
      <section><h2>To do <span id="todoNote"></span></h2><ol id="todo"></ol></section>
      <section><h2>Today <span id="day"></span></h2><ul id="calendar"></ul></section>
      <section><h2>Lead pipeline <span id="leadTotal"></span></h2><div class="bars" id="leads"></div><p class="foot" id="leadNote"></p></section>
    </div>
  </div>
  <p class="foot" id="footer"></p>
</div>

<!-- Data lives in two files next to this page:
     data.json — replaced by the 08:15 morning update and the inbox checks.
     todo.json — Marius's own task list; never overwritten by the morning refresh.
     The page re-fetches both every 5 minutes, so it can stay open on a screen. -->
<script>
(async function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pill=t=>t?`<span class="pill p-${esc(t)}">${t==='urgent'?'Now':t==='today'?'Today':t==='auto'?'Claude':'FYI'}</span>`:'';
  const load=async f=>{const r=await fetch(f+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.json()};
  async function render(){
    let D,T={items:[]};
    try{D=await load('data.json')}catch(e){$('stamp').textContent='data.json not found';return}
    try{T=await load('todo.json')}catch(e){}
    $('stamp').textContent=D.updated||'';
    $('day').textContent=D.day||'';
    $('emailNote').textContent=(D.emails||[]).length+' of the inbox';
    $('emails').innerHTML=(D.emails||[]).map((e,i)=>`<li><span class="n">0${i+1}</span><div><div class="t">${pill(e.tag)}${esc(e.subject)}</div></div><div class="d">${esc(e.from)}. ${esc(e.why)}</div></li>`).join('');
    $('approvals').innerHTML=(D.approvals||[]).map(a=>`<li><span class="n">□</span><div class="t">${pill(a.tag)}${esc(a.item)}</div><div class="d">${esc(a.detail)}</div></li>`).join('');
    $('todoNote').textContent=T.note||'';
    const open=T.items.filter(a=>!a.done),done=T.items.filter(a=>a.done);
    $('todo').innerHTML=open.map((a,i)=>`<li><span class="n">0${i+1}</span><div class="t">${pill(a.tag)}${esc(a.task)}</div>${a.detail?`<div class="d">${esc(a.detail)}</div>`:''}</li>`).join('')
      +done.map(a=>`<li class="done"><span class="n">✓</span><div class="t">${esc(a.task)}</div><div class="d">Done${a.doneOn?' '+esc(a.doneOn):''}</div></li>`).join('');
    $('calendar').innerHTML=(D.calendar||[]).map(c=>`<li><span class="time">${esc(c.time)}</span><div class="t">${c.auto?pill('auto'):''}${esc(c.title)}</div></li>`).join('');
    const L=D.leads||[],max=Math.max(1,...L.map(l=>l[1])),tot=L.reduce((s,l)=>s+l[1],0);
    $('leadTotal').textContent=tot+' leads';
    $('leads').innerHTML=L.map(([n,v])=>`<div class="bar"><div class="lab"><span class="fill" style="width:${(v/max*100).toFixed(1)}%"></span><b>${esc(n)}</b></div><span class="v">${v}</span></div>`).join('');
    $('leadNote').textContent=D.leadNote||'';
    $('footer').textContent=D.updatedNote||'';
  }
  await render();
  setInterval(render,5*60*1000);
})();
</script>
</body>
</html>
